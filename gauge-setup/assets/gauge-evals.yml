# Scheduled agent-experience evals with Gauge.
# Copy to .github/workflows/gauge-evals.yml. Needs a repository secret
# GAUGE_API_TOKEN holding a Gauge organization API key with read & write access
# (create it in the Gauge web app under Settings > API Keys).
# This workflow spends credits on every run; keep the budget below in line with
# what the team approved.
# Tested with Gauge CLI 0.31.0. Consider pinning the actions below to commit SHAs.
name: Gauge evals

on:
  schedule:
    - cron: "0 7 * * 1" # weekly; change to taste
  workflow_dispatch:
    inputs:
      suite:
        description: "smoke, deep, pending, or all"
        default: "smoke"
      max_sessions:
        description: "upper bound on sessions for this run"
        default: "40"

permissions:
  contents: read

concurrency:
  group: gauge-evals
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install a pinned Gauge CLI
        run: npm install -g @withgauge/cli@0.31.0 # pin; update deliberately
      - name: Check eval files
        env:
          GAUGE_API_TOKEN: ${{ secrets.GAUGE_API_TOKEN }}
          # GAUGE_ORG: your-org-slug   # only needed if the key can reach several orgs
        run: node gauge-kit/gauge-kit.mjs verify
      - name: Run evals
        env:
          GAUGE_API_TOKEN: ${{ secrets.GAUGE_API_TOKEN }}
          # GAUGE_ORG: your-org-slug
          # Inputs go through the environment, never straight into the shell.
          SUITE: ${{ inputs.suite || 'smoke' }}
          MAX_SESSIONS: ${{ inputs.max_sessions || '40' }}
        run: >
          node gauge-kit/gauge-kit.mjs run --yes
          --suite "$SUITE"
          --max-sessions "$MAX_SESSIONS"
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauge-results
          path: gauge-kit/last-results.*
          if-no-files-found: ignore
